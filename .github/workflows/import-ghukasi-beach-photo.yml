name: Import GHUKASI beach portrait to repository
on:
  push:
    paths:
      - .github/workflows/import-ghukasi-beach-photo.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  store-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy authentic portrait to website assets
        env:
          SOURCE_PHOTO: "https://d2ol7oe51mr4n9.cloudfront.net/user_37Dc07D7EvQdZgZHJixX0inzkd2/41f58805-fc65-48fa-af98-cc5c67a7bb1e.jpg"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 60 "$SOURCE_PHOTO" -o assets/ghukasi-beach-photo.jpg
          test "$(wc -c < assets/ghukasi-beach-photo.jpg)" -gt 10000
          file assets/ghukasi-beach-photo.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ghukasi-beach-photo.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Store GHUKASI authentic beach portrait on website"
            git push
          fi
